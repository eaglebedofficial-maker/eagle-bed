<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Pilot Studio</title>
<link rel="icon" href="icons/icon48.png">
<style id="uicss"></style>
<style>
html,body{margin:0;background:var(--bg)}body{min-height:100vh}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--sf);border-right:1px solid var(--ln);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:9px;align-items:center;padding:0 6px 14px}
.brand .m{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--ac),var(--aci));color:#fff;display:grid;place-items:center;font-weight:800}
.nb{display:flex;gap:9px;align-items:center;width:100%;border:0;background:transparent;color:var(--mu);font:inherit;font-weight:600;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.nb:hover{background:var(--sf2);color:var(--fg)}.nb[aria-current=true]{background:var(--acs);color:var(--ac)}
.ng{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--fa);font-weight:700;margin:14px 10px 4px}
main{padding:22px 26px 60px;min-width:0}
.vh{margin-bottom:16px}.vh h1{font-size:22px}.vh p{color:var(--mu);margin:4px 0 0;max-width:80ch}
@media(max-width:820px){.shell{grid-template-columns:1fr}nav{position:static;height:auto}}
</style></head>
<body class="pp">
<div class="shell pp" id="app">
  <nav>
    <div class="brand"><div class="m">P</div><div><b>Product Pilot</b><div class="small muted">Studio</div></div></div>
    <div class="ng">Research</div>
    <button class="nb" data-v="dashboard">🏠 Dashboard</button>
    <button class="nb" data-v="research">🗄️ Product research</button>
    <button class="nb" data-v="keywords">🔑 Keyword research</button>
    <button class="nb" data-v="reverse">🔁 Reverse ASIN</button>
    <div class="ng">Track</div>
    <button class="nb" data-v="tracker">📈 Product tracker</button>
    <button class="nb" data-v="ranks">🎯 Keyword rank tracker</button>
    <div class="ng">Build &amp; sell</div>
    <button class="nb" data-v="profit">💷 Profit calculator</button>
    <button class="nb" data-v="listing">📝 Listing builder</button>
    <button class="nb" data-v="reviews">💬 Review analyzer</button>
    <div class="ng">Setup</div>
    <button class="nb" data-v="settings">⚙️ Settings</button>
  </nav>
  <main id="view"></main>
</div>
<script src="engine.js"></script><script src="ui.js"></script><script src="net.js"></script><script src="studio.js"></script>
</body></html>
