# Kestrel: full stack. `cp .env.example .env`, fill the secrets, then `docker compose up --build`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kestrel
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U kestrel"], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://kestrel:${POSTGRES_PASSWORD}@db:5432/kestrel
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
    volumes: [storage:/app/storage]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    ports: ["8000:8000"]
  worker:
    build: ./api
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://kestrel:${POSTGRES_PASSWORD}@db:5432/kestrel
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
    volumes: [storage:/app/storage]
    depends_on: { api: { condition: service_started } }
  web:
    build: { context: ./web, args: { API_URL: http://api:8000 } }
    environment: { API_URL: http://api:8000 }
    depends_on: [api]
    ports: ["3000:3000"]
volumes: { pgdata: {}, redisdata: {}, storage: {} }
